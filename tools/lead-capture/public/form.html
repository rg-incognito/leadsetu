<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:420px;margin:40px auto;padding:0 20px;}
  h1{font-size:22px;margin-bottom:6px;}
  p.sub{color:#666;margin-bottom:20px;font-size:14px;}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;}
  input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit;}
  textarea{min-height:80px;resize:vertical;}
  button{margin-top:18px;width:100%;padding:12px;background:#e0572f;color:#fff;border:none;border-radius:8px;
    font-size:15px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.6;cursor:default;}
  #status{margin-top:12px;font-size:14px;}
</style>
</head>
<body>
  <h1>Contact Us</h1>
  <p class="sub">Apna number ya email de dein, hum turant reply karenge.</p>
  <form id="leadForm">
    <label for="name">Naam</label>
    <input id="name" name="name" required>
    <label for="contact">Phone ya Email</label>
    <input id="contact" name="contact" required>
    <label for="message">Aapko kya chahiye?</label>
    <textarea id="message" name="message"></textarea>
    <button type="submit">Bhejein</button>
    <div id="status"></div>
  </form>

  <script>
    // Point this at the deployed /api/lead endpoint for this client's Vercel project.
    const ENDPOINT = "/api/lead";

    const form = document.getElementById('leadForm');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      statusEl.textContent = 'Bhej rahe hain...';

      const data = Object.fromEntries(new FormData(form).entries());
      data.source = 'form.html';

      try {
        const resp = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await resp.json();
        if (json.ok) {
          statusEl.textContent = 'Dhanyavaad! Hum jald contact karenge.';
          form.reset();
        } else {
          statusEl.textContent = 'Kuch gadbad hui, dobara try karein.';
        }
      } catch {
        statusEl.textContent = 'Kuch gadbad hui, dobara try karein.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
